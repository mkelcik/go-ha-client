name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * *"

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: true
      - run: make tools
      - run: make ci

  mod_tidy_check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: true
      - run: |
          cp go.mod /tmp/go.mod
          if [ -f go.sum ]; then cp go.sum /tmp/go.sum; fi
          go mod tidy
          diff -u /tmp/go.mod go.mod
          if [ -f /tmp/go.sum ]; then diff -u /tmp/go.sum go.sum; fi

  race:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: true
      - run: go test -race ./...

  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: true
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vuln_nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: "$(go env GOPATH)/bin/govulncheck ./..."
