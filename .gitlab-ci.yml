image: golang:1.24.11

variables:
  GOTOOLCHAIN: "go1.24.11"
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"

cache:
  key: "go-cache"
  paths:
    - .cache/go/pkg/mod
    - .cache/go/build

stages:
  - ci
  - nightly
  - release

ci:
  stage: ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  script:
    - make tools
    - make ci

mod_tidy_check:
  stage: ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  script:
    - cp go.mod /tmp/go.mod
    - if [ -f go.sum ]; then cp go.sum /tmp/go.sum; fi
    - go mod tidy
    - diff -u /tmp/go.mod go.mod
    - if [ -f /tmp/go.sum ]; then diff -u /tmp/go.sum go.sum; fi

race:
  stage: ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  script:
    - go test -race ./...

coverage:
  stage: ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  script:
    - go test -coverprofile=coverage.out -covermode=atomic ./...
  artifacts:
    when: always
    paths:
      - coverage.out

vuln_nightly:
  stage: nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - "$(go env GOPATH)/bin/govulncheck" ./...

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["ci"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - release-cli create --name "Release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "Automated release for $CI_COMMIT_TAG"
